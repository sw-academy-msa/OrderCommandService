# 기존 Command PostgreSQL 인스턴스의 Order 전용 논리 DB·계정입니다.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/order_command}
    username: ${DB_USERNAME:orders}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    # Flyway 통합 전 update와 약관 전용 이력으로 V1~V3 내용이 이미 있는 개발 DB는 실행하지 않고 V3까지 적용된 것으로 기록합니다.
    # 빈 DB에서는 V1부터 실행합니다. 이전 checkout_terms_schema_history 테이블은 더 이상 읽지 않습니다.
    baseline-on-migrate: true
    baseline-version: 3
  jpa:
    hibernate:
      ddl-auto: update
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
order:
  service-auth:
    # 로컬 프로필에서만 HTTP 자격증명 전송을 허용하며 운영은 TLS가 필요합니다.
    allow-insecure-local: true
  clients:
    scheme: http
