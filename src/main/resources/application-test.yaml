# 개발 .env와 외부 AWS/Eureka를 테스트에서 읽지 않습니다.
spring:
  config:
    import: optional:classpath:/test-overrides.properties
  jpa:
    hibernate:
      ddl-auto: none
  # HTTP fixture에는 /actuator/health가 없으므로 상태 확인 대신 기본 인스턴스 목록을 씁니다. 재시도 설정은 그대로 검증합니다.
  cloud:
    loadbalancer:
      configurations: default
eureka:
  client:
    enabled: false
order:
  service-auth:
    enabled: false
  clients:
    scheme: http
  saga:
    enabled: false
  outbox:
    publisher-enabled: false
  auth:
    issuer: https://account.test
    audience: stockdrop-api
    jwk-set-uri: http://localhost:1/.well-known/jwks.json
