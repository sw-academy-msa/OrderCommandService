# 기존 Command DB/Eureka/Kafka를 사용합니다. 운영은 ALB 접근 바인딩과 내부 listener를 별도로 설정합니다.
name: stockdrop-order-command
services:
  app:
    build: .
    ports:
      - "127.0.0.1:8083:8083"
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://host.docker.internal:5434/order_command
      EUREKA_DEFAULT_ZONE: http://host.docker.internal:8761/eureka/
      ACCOUNT_JWKS_URI: http://host.docker.internal:8080/.well-known/jwks.json
      SERVICE_HOSTNAME: host.docker.internal
      # 공유 Kafka Compose 네트워크를 사용할 때 kafka:9092 내부 listener에 연결합니다.
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_PORT: 8083
    networks:
      - default
      - kafka
networks:
  kafka:
    external: true
    name: stockdrop-query-kafka_default
